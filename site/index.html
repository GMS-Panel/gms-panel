<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMS Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .kutu { text-align: center; padding: 50px; background: #16213e; border-radius: 10px; border: 1px solid #0f3460; max-width: 500px; }
        h1 { color: #e94560; font-size: 2em; margin-bottom: 10px; }
        p { color: #aaa; margin: 10px 0; line-height: 1.6; }
        .btn { display: inline-block; margin-top: 20px; padding: 12px 30px; background: #e94560; color: #fff; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .btn:hover { background: #c73652; }
        .versiyon { margin-top: 20px; font-size: 11px; color: #555; }
    </style>
</head>
<body>
    <div class="kutu">
        <h1>GMS Panel</h1>
        <p>Bu sunucu <strong>GMS Panel</strong> ile yapilandirilmistir.</p>
        <p>Guvenli, hizli ve yonetimi kolay hosting altyapisi.</p>
        <a href="https://panel.gms.tr" class="btn">Yonetim Paneli</a>
        <p class="versiyon">GMS Panel v1.0 | Alma Linux 9</p>
    </div>
</body>
</html>
